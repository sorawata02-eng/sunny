<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunny をダウンロード</title>
<meta name="description" content="Sunny: Wake Up Alarm を App Store で入手する。">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#ffffff">

<!-- Safari on iOS shows a native "App Store で見る" banner from this. -->
<meta name="apple-itunes-app" content="app-id=6799345297">
<link rel="canonical" href="https://apps.apple.com/jp/app/sunny-wake-up-alarm/id6799345297">
<link rel="apple-touch-icon" href="../img/mark.png">
<link rel="stylesheet" href="get.css">

<!-- This page exists to be left. Instagram will not take an App Store link in a
     bio, so the bio points here and here points at the App Store.

     Changing the domain is only half of it: Instagram opens links in its own
     WebView, and sending that WebView to apps.apple.com can render the App Store
     *web page* inside it, with no Get button and no way forward. The escape is a
     scheme the host app understands — `instagram://extbrowser` — which hands the
     URL to the real browser. See inapp-browser.js for the per-app strategies and
     the caveat that none of them are documented by Meta or Apple.

     Ported from a version already shipping for another app, with its tests:
     `node --test Tools/webtests/inapp-browser.test.js`. -->

<script>
  /* Switch to the loading state before anything paints. Without JavaScript this
     never runs, so the download button below is visible immediately rather than
     a spinner that would never resolve. */
  document.documentElement.setAttribute('data-state', 'loading');

  /* Safety net: if main.js fails to load at all, never leave the visitor
     staring at 「App Store を開いています…」 forever. */
  window.setTimeout(function () {
    var root = document.documentElement;
    if (root.getAttribute('data-state') === 'loading') {
      root.setAttribute('data-state', 'fallback');
    }
  }, 4000);
</script>
</head>

<body>
<main class="bridge">
  <span class="mark" aria-hidden="true"></span>

  <!-- While the automatic redirect is being attempted. -->
  <div class="state state--loading">
    <p class="status" role="status">App&nbsp;Store を開いています…</p>
    <div class="spinner" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>

  <!-- Only if the automatic redirect did not happen. -->
  <div class="state state--fallback">
    <!-- A real link: it works with JavaScript switched off. main.js appends the
         `ct` campaign tag to this href on load — change the URL here only. -->
    <a class="cta" id="ctaLink" data-appstore-link
       href="https://apps.apple.com/jp/app/sunny-wake-up-alarm/id6799345297">
      <img src="../img/appstore-badge.svg" width="109" height="40" alt="App Store でダウンロード">
    </a>

    <p class="hint">
      開かないときは <strong class="dots">•••</strong> から
      <strong>「ブラウザで開く」</strong>を選んでください
    </p>

    <div class="copy">
      <label class="visually-hidden" for="linkField">App Store のリンク</label>
      <div class="copy__row">
        <input class="copy__field" id="linkField" type="text" readonly spellcheck="false"
               value="https://apps.apple.com/jp/app/sunny-wake-up-alarm/id6799345297">
        <button class="copy__btn" id="copyBtn" type="button">コピー</button>
      </div>
      <p class="copy__status" id="copyStatus" role="status" aria-live="polite"></p>
    </div>
  </div>

  <!-- Instead of everything above, on Android. Sunny is iPhone-only, so there is
       no redirect to make and no App Store link worth showing. -->
  <div class="state state--android">
    <p class="android-note">Sunny は iPhone 専用です。<br>iOS 26 以降の iPhone でご利用ください。</p>
  </div>

  <a class="home" href="../">Sunny について</a>
</main>

<script src="inapp-browser.js"></script>
<script src="main.js"></script>
</body>
</html>
